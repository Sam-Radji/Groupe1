name: n8n

services:
  n8n-db:
    image: postgres:16-alpine
    container_name: n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?à définir dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?à définir dans .env}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - n8n-net          # réseau privé : la base n'est joignable que par n8n

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: ${PUBLIC_IP:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://${PUBLIC_IP:-localhost}:5678/
      N8N_SECURE_COOKIE: "false"   # accès en HTTP simple
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?à définir dans .env}
      GENERIC_TIMEZONE: ${TZ:-Europe/Paris}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - n8n-net          # accès à PostgreSQL
      - services-net     # réception des webhooks WordPress, supervision Zabbix

  n8n-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: n8n-agent
    restart: unless-stopped
    user: root            # nécessaire pour lire le socket Docker
    environment:
      ZBX_HOSTNAME: "n8n"               # doit correspondre au nom d'hôte créé dans Zabbix
      ZBX_SERVER_HOST: zabbix-server    # autorise uniquement ce serveur à l'interroger
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - services-net       # Zabbix Server doit pouvoir le joindre sur ce réseau

volumes:
  n8n_db_data:
  n8n_data:

networks:
  n8n-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.2.0/24
  services-net:
    external: true
